services:
  app:
    build: .
    image: ${DOCKER_IMAGE:-app-presenze:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Everything has a working default except the ones marked in .env.example.
      TZ: ${TZ:-Europe/Rome}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-Presenze}
      COMPANY_NAME: ${COMPANY_NAME:-}
      HOLIDAY_PATRON_DAYS: ${HOLIDAY_PATRON_DAYS:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}

      ENABLE_CRON: ${ENABLE_CRON:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      REMINDER_CRON: ${REMINDER_CRON:-0 19 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_COUNT: ${BACKUP_MIN_COUNT:-7}
      BACKUP_EMAIL_TO: ${BACKUP_EMAIL_TO:-}
    volumes:
      - data:/app/data
      - backups:/app/backups

# SQLite plus in-process cron means exactly one instance. Scaling this service
# would corrupt the first and double-fire the second.
volumes:
  data:
  backups:
