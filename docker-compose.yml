services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presenze}
      POSTGRES_USER: ${POSTGRES_USER:-presenze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve una password per il database}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?serve una password per il ruolo applicativo}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the unprivileged role the application uses. Runs once, when the
      # data directory is first initialised.
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presenze} -d ${POSTGRES_DB:-presenze}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    image: ${DOCKER_IMAGE:-app-presenze:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Everything has a working default except the ones marked in .env.example.
      TZ: ${TZ:-Europe/Rome}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-Presenze}
      DEFAULT_HOLIDAY_PATRON_DAYS: ${DEFAULT_HOLIDAY_PATRON_DAYS:-}

      # The application runs as the restricted role; only migrations and the
      # cross-company paths use the owner. See .env.example.
      DATABASE_URL: postgres://presenze_app:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-presenze}
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-presenze}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-presenze}

      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}

      ENABLE_CRON: ${ENABLE_CRON:-true}
      REMINDER_CRON: ${REMINDER_CRON:-0 19 * * *}

# The application itself is stateless now: everything durable is in Postgres,
# and the scheduled jobs take an advisory lock, so a second replica no longer
# means a second scheduler. Back the database up from outside the container —
# `pg_dump` on a host cron — rather than from inside the application.
volumes:
  pgdata:
