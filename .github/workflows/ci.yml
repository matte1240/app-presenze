name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The isolation between customers is enforced partly by PostgreSQL row
      # policies, so it cannot be tested without one. A job that skipped those
      # tests would be green on exactly the failure that matters most.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: presenze_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: presenze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presenze_owner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate route tree
        run: npm run generate:routes

      - name: Typecheck
        run: npm run typecheck

      # The domain engine decides what people get paid. This step is the point
      # of the job; the previous workflow declared a "test" step that ran none.
      - name: Test
        run: npm test

      # The restricted role is what the policies actually apply to: running the
      # isolation tests as the table owner would prove nothing, since PostgreSQL
      # exempts owners.
      - name: Create the application role
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE presenze_app LOGIN PASSWORD 'app';
            GRANT USAGE ON SCHEMA public TO presenze_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE presenze_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO presenze_app;
          SQL
        env:
          ADMIN_URL: postgres://presenze_owner:owner@localhost:5432/presenze_test

      - name: Test — isolation, billing and back-office
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://presenze_app:app@localhost:5432/presenze_test
          TEST_DATABASE_ADMIN_URL: postgres://presenze_owner:owner@localhost:5432/presenze_test

      - name: Build
        run: npm run build

  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
