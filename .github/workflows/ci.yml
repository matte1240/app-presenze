name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The isolation between customers is enforced partly by PostgreSQL row
      # policies, so it cannot be tested without one. A job that skipped those
      # tests would be green on exactly the failure that matters most.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: presenze_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: presenze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presenze_owner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate route tree
        run: npm run generate:routes

      - name: Typecheck
        run: npm run typecheck

      # The domain engine decides what people get paid. This step is the point
      # of the job; the previous workflow declared a "test" step that ran none.
      - name: Test
        run: npm test

      # The restricted role is what the policies actually apply to: running the
      # isolation tests as the table owner would prove nothing, since PostgreSQL
      # exempts owners.
      - name: Create the application role
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE presenze_app LOGIN PASSWORD 'app';
            GRANT USAGE ON SCHEMA public TO presenze_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE presenze_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO presenze_app;
          SQL
          # A second database for the browser smoke suite, so it never races the
          # API tests over the same rows. A third, isolated from both, for the
          # backup suite: it runs a real `pg_restore --clean`, which drops and
          # recreates every table in whatever database it points at — sharing
          # one with tests running alongside it would mean the last to finish
          # decides what's left.
          createdb -h localhost -U presenze_owner presenze_e2e
          psql "$E2E_URL" -v ON_ERROR_STOP=1 <<'SQL'
            GRANT USAGE ON SCHEMA public TO presenze_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE presenze_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO presenze_app;
          SQL
          createdb -h localhost -U presenze_owner presenze_backup
          psql "$BACKUP_URL" -v ON_ERROR_STOP=1 <<'SQL'
            GRANT USAGE ON SCHEMA public TO presenze_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE presenze_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO presenze_app;
          SQL
        env:
          PGPASSWORD: owner
          ADMIN_URL: postgres://presenze_owner:owner@localhost:5432/presenze_test
          E2E_URL: postgres://presenze_owner:owner@localhost:5432/presenze_e2e
          BACKUP_URL: postgres://presenze_owner:owner@localhost:5432/presenze_backup

      - name: Test — isolation, billing and back-office
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://presenze_app:app@localhost:5432/presenze_test
          TEST_DATABASE_ADMIN_URL: postgres://presenze_owner:owner@localhost:5432/presenze_test

      # pg_dump/pg_restore are not part of the runner image; installed at the
      # same major version as the `postgres:17-alpine` service above, since
      # pg_dump does not officially support dumping from a newer server than
      # itself.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Test — backup and restore
        run: npm run test:backup
        env:
          TEST_DATABASE_URL: postgres://presenze_app:app@localhost:5432/presenze_backup
          TEST_DATABASE_ADMIN_URL: postgres://presenze_owner:owner@localhost:5432/presenze_backup

      - name: Build
        run: npm run build

      # The one thing no API test can check is whether a page is reachable at
      # all. The back-office once shipped unreachable — a layout route with no
      # <Outlet/> — with every other check green.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test in a browser
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://presenze_app:app@localhost:5432/presenze_e2e
          E2E_DATABASE_ADMIN_URL: postgres://presenze_owner:owner@localhost:5432/presenze_e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
